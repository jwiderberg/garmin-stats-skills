[project]
name = "garmin-stats-skills"
version = "0.3.2"
description = "Read your own Garmin Connect data from Claude (Cowork / Claude Code) via a local MCP server."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "garminconnect>=0.3.20,<0.4",
    "curl_cffi>=0.10",
    "mcp>=1.10,<2",
]

[project.scripts]
garmin-stats = "garmin_stats.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/garmin_stats"]

# Ship the Claude plugin itself inside the package, so `garmin-stats
# plugin-zip` can build the Cowork upload from any installation.
[tool.hatch.build.targets.wheel.force-include]
".claude-plugin" = "garmin_stats/plugin/.claude-plugin"
".mcp.json" = "garmin_stats/plugin/.mcp.json"
"skills" = "garmin_stats/plugin/skills"
"README.md" = "garmin_stats/plugin/README.md"
"LICENSE" = "garmin_stats/plugin/LICENSE"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
