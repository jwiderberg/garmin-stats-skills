[project]
name = "garmin-stats-skills"
version = "0.1.0"
description = "Read your own Garmin Connect data from Claude (Cowork / Claude Code) via a local MCP server."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "garminconnect>=0.3.20,<0.4",
    "curl_cffi>=0.10",
    "mcp>=1.10,<2",
]

[project.scripts]
garmin-stats = "garmin_stats.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/garmin_stats"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
